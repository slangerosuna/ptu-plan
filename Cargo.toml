[package]
name = "ptu-plan"
version = "0.1.0"
edition = "2024"
description = "Partition To Unordered: an HDDL domain/problem loader and solver"
default-run = "ptu-plan"
license = "AGPL-3.0-or-later"
readme = "README.md"

[features]
default = []

[lib]
name = "ptu_plan"
path = "src/lib.rs"

[[bin]]
name = "ptu-plan"
path = "src/main.rs"

[[bin]]
name = "train"
path = "src/train.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
good_lp = { version = "1.15.3", default-features = false, features = ["scip", "scip_bundled"], optional = true }
nalgebra = "0.35.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
burn = { version = "0.22.1", optional = true }
rayon = { version = "1", optional = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
